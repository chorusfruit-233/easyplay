name: Flutter checks

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: flutter-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Verify Pikafish assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y 7zip
          python3 tools/prepare_pikafish.py

      - name: Verify Stockfish assets
        run: python3 tools/prepare_stockfish.py

      - name: Verify Rapfi assets
        run: python3 tools/prepare_rapfi.py

      - name: Verify DouZero models and runtime
        run: python3 tools/prepare_douzero.py

      - run: flutter pub get
      - name: Android packaging retry tests
        run: python3 -m unittest discover -s tools/tests
      - run: dart analyze lib test
      - name: Native Stockfish smoke setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user
          printf '#!/bin/sh\nexec qemu-aarch64 "%s"\n' "$PWD/android/app/src/main/jniLibs/arm64-v8a/libstockfish.so" > "$RUNNER_TEMP/stockfish-test"
          chmod +x "$RUNNER_TEMP/stockfish-test"
          echo "STOCKFISH_TEST_EXECUTABLE=$RUNNER_TEMP/stockfish-test" >> "$GITHUB_ENV"
      - name: Native Pikafish smoke setup
        run: |
          printf '#!/bin/sh\nexec qemu-aarch64 "%s"\n' "$PWD/android/app/src/main/jniLibs/arm64-v8a/libpikafish.so" > "$RUNNER_TEMP/pikafish-test"
          chmod +x "$RUNNER_TEMP/pikafish-test"
          echo "PIKAFISH_TEST_EXECUTABLE=$RUNNER_TEMP/pikafish-test" >> "$GITHUB_ENV"
      - name: Native Rapfi smoke setup
        run: |
          printf '#!/bin/sh\nexec qemu-aarch64 "%s"\n' "$PWD/android/app/src/main/jniLibs/arm64-v8a/librapfi.so" > "$RUNNER_TEMP/rapfi-test"
          chmod +x "$RUNNER_TEMP/rapfi-test"
          echo "RAPFI_TEST_EXECUTABLE=$RUNNER_TEMP/rapfi-test" >> "$GITHUB_ENV"
      - name: Pinned Asian rule reference cases
        run: python3 tools/test_pikafish_rules.py
      - run: flutter test
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Material color Android/Web parity
        run: |
          npm install --no-save --package-lock=false esbuild@0.25.12
          node tools/build_material_colors.cjs
          git diff --exit-code -- web/material_colors.js
          node tools/test_material_colors.cjs
      - name: Stockfish browser Worker smoke
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          node tools/test_stockfish_web.cjs
          node tools/test_pikafish_web.cjs
          node tools/test_rapfi_web.cjs
      - name: DouZero WASM reference and compatibility checks
        run: node tools/test_douzero_web.cjs
      - name: WebRTC production transport browser smoke
        run: |
          flutter build web --release --no-wasm-dry-run --base-href /easyplay/ --target test/lan/rtc_browser_smoke.dart --output build/rtc-smoke
          node tools/test_rtc_web.cjs
      - name: Three-player DouDizhu browser smoke
        run: |
          flutter build web --release --no-wasm-dry-run --base-href /easyplay/ --target test/doudizhu/rtc_browser_smoke.dart --output build/doudizhu-smoke
          node tools/test_doudizhu_web.cjs
      - name: Theme browser smoke
        run: |
          flutter build web --release --no-wasm-dry-run --base-href /easyplay/ --target test/theme_browser_smoke.dart --output build/theme-smoke
          node tools/test_theme_web.cjs
      - name: Board move animation browser smoke
        run: |
          flutter build web --release --no-wasm-dry-run --base-href /easyplay/ --target test/board_motion_browser_smoke.dart --output build/board-motion-smoke
          node tools/test_board_motion_web.cjs
      - run: flutter build web --no-wasm-dry-run
      - name: Soosyrv-8 opening and confirmation browser smoke
        run: node tools/test_gomoku_placement_web.cjs
      - name: Gomoku and Draughts AI duel browser smoke
        run: node tools/test_ai_duel_web.cjs
      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Build and verify minified Android APK
        run: |
          # CI-only signing: exercise release R8 without production credentials.
          CI_KEYSTORE="$RUNNER_TEMP/easyplay-r8-check.jks"
          trap 'rm -f android/key.properties "$CI_KEYSTORE"' EXIT
          keytool -genkeypair -noprompt -keystore "$CI_KEYSTORE" \
            -storepass android -keypass android -alias ci -keyalg RSA \
            -keysize 2048 -validity 1 -dname "CN=EasyPlay CI"
          cat > android/key.properties <<EOF
          storeFile=$CI_KEYSTORE
          storePassword=android
          keyAlias=ci
          keyPassword=android
          EOF
          python3 tools/package_lan_android.py --network-retries 2
          python3 tools/check_douzero_android.py build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - name: DouZero native JNI references
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon
