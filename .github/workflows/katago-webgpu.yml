name: Experimental KataGo WebGPU build

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_katago_webgpu.sh'
      - 'tools/test_katago_webgpu.mjs'
      - '.github/workflows/katago-webgpu.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned browser Search ABI
        run: bash tools/build_katago_webgpu.sh
      - name: Build pinned single-thread NN ABI
        run: bash tools/build_katago_webgpu.sh single
      - name: Verify bundled b6 and Eigen fallback
        run: node tools/test_katago_webgpu.mjs
