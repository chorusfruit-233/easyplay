name: Create v1.2.0 tag

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/create-v1.2.0-tag.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create and push v1.2.0
        run: |
          if git rev-parse "refs/tags/v1.2.0" >/dev/null 2>&1; then
            echo "v1.2.0 already exists"
            exit 0
          fi
          git tag v1.2.0 b9f72bffa21fcf7e334343390a5e4923294310a6
          git push origin refs/tags/v1.2.0
