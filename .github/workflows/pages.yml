name: Deploy Web to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: |
          flutter build web \
            --release \
            --no-wasm-dry-run \
            --base-href /easyplay/

      - name: Check threaded KataGo assets
        run: |
          test -s build/web/coi-serviceworker.js
          test -s build/web/flutter_bootstrap.js
          ! grep -Fq 'serviceWorkerVersion:' build/web/flutter_bootstrap.js
          test -s build/web/katago/katago.js
          test -s build/web/katago/katago.wasm
          test -s build/web/katago-webgpu/kataeval.js
          test -s build/web/katago-webgpu/kataeval.wasm
          test -s build/web/katago-webgpu/kataeval-mt.js
          test -s build/web/katago-webgpu/kataeval-mt.wasm
          test -s build/web/assets/assets/katago/g170-b6c96-s175395328-d26788732.bin.gz

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
