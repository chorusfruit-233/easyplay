name: Build v1.2.0 APK release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-v1.2.0-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout v1.2.0
        uses: actions/checkout@v6
        with:
          ref: v1.2.0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks

      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Analyze
        run: dart analyze lib test

      - name: Test
        run: flutter test

      - name: Build signed LAN APKs
        run: python3 tools/package_lan_android.py

      - name: Show APKs
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.2.0
        run: |
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --verify-tag \
              --generate-notes \
              --title "$TAG"
          fi
