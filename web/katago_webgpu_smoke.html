<!doctype html><html><head><script src="coi-serviceworker.js"></script>
<script src="katago-webgpu/kataeval.js"></script></head><body>
<pre id="result">waiting</pre><script>
(async () => {
  const output = document.getElementById('result');
  try {
    const url = 'assets/assets/katago/g170-b6c96-s175395328-d26788732.bin.gz';
    const model = new Uint8Array(await (await fetch(url)).arrayBuffer());
    const run = async (cpu) => {
      const M = await createKata({locateFile: p => new URL('katago-webgpu/' + p, location.href).href});
      if (cpu) M.ccall('kgeSetForceCpu', null, ['number'], [1]);
      M.FS.writeFile('/b6.bin.gz', model);
      if (!(await M.ccall('kgeLoad', 'number', ['string','number'], ['/b6.bin.gz', 9], {async:true})))
        throw new Error('load: ' + M.ccall('kgeError','string',[],[]));
      const backend = M.ccall('kgeBackendIsGpu', 'number', [], []) ? 'webgpu' : 'eigen';
      const stones = M._malloc(81*4), policy = M._malloc(82*4), value = M._malloc(5*4);
      const positions = [];
      for (const stone of [-1, 40]) {
        M.HEAP32.fill(0, stones>>2, (stones>>2)+81);
        if (stone >= 0) M.HEAP32[(stones>>2)+stone] = 1;
        if (!(await M.ccall('kgeEval','number',
          ['number','number','number','number','number','number'],
          [stones,stone < 0 ? 1 : 2,7.5,policy,value,0], {async:true})))
          throw new Error('eval: ' + M.ccall('kgeError','string',[],[]));
        positions.push({policy:Array.from(M.HEAPF32.slice(policy>>2,(policy>>2)+82)),
          value:Array.from(M.HEAPF32.slice(value>>2,(value>>2)+5))});
      }
      return {backend, positions};
    };
    output.textContent = 'running GPU';
    const gpu = await run(false);
    output.textContent = 'running CPU';
    const cpu = await run(true);
    const finite = [...gpu.positions,...cpu.positions]
      .flatMap(p=>[...p.policy,...p.value]).every(Number.isFinite);
    const diffs = gpu.positions.map((p,j)=>({
      policy:Math.max(...p.policy.map((v,i)=>Math.abs(v-cpu.positions[j].policy[i]))),
      value:Math.max(...p.value.map((v,i)=>Math.abs(v-cpu.positions[j].value[i]))),
    }));
    const pass = gpu.backend === 'webgpu' && cpu.backend === 'eigen' && finite &&
      diffs.every(d=>d.policy < 0.001 && d.value < 0.001);
    output.textContent = JSON.stringify({pass,gpu:gpu.backend,cpu:cpu.backend,finite,diffs});
  } catch (error) {output.textContent='ERROR: '+String(error);}
})();
</script></body></html>
